  "allow-host-set-ai",
  "allow-host-set-campaign-name",
  "allow-host-start-campaign",
  "allow-host-assign",
  "allow-host-refuse",
  "allow-host-pause",
  "allow-host-resume-auto",
  "allow-host-save",
  "allow-join",
  "allow-lobby-set-profile",
  "allow-send-intent",
  "allow-propose-speed",
  "allow-vote",
  "allow-presence",
  "allow-route-info",
  "allow-plan-preview",
  "allow-plan-shuttle",
  "allow-leave",
